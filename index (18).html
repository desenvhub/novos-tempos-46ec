/* ---------------- Perfis / Avatares ---------------- */
function slugify(name) {
  return (name || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
const AVATAR_COLORS = ["bg-indigo-500", "bg-amber-500", "bg-sky-500", "bg-violet-500", "bg-rose-500", "bg-emerald-500"];
function colorFor(name) {
  let h = 0;
  for (let i = 0; i < (name || "").length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}
function initials(name) {
  const parts = (name || "?").trim().split(/\s+/);
  return ((parts[0]?.[0] || "") + (parts[1]?.[0] || "")).toUpperCase() || "?";
}
const ADMIN_SLUGS = ["janaina"];
function isAdminName(name) {
  const s = slugify(name);
  return ADMIN_SLUGS.some((a) => s.startsWith(a));
}
function Avatar({ name, profiles, size = 36, badge }) {
  const photoURL = profiles[slugify(name)]?.photoURL;
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      {photoURL ? (
        <img src={photoURL} alt={name} className="w-full h-full rounded-full object-cover border border-white shadow-sm" style={{ width: size, height: size }} />
      ) : (
        <div className={`w-full h-full rounded-full flex items-center justify-center text-white font-medium shadow-sm ${colorFor(name)}`}
          style={{ width: size, height: size, fontSize: size * 0.38 }}>
          {initials(name)}
        </div>
      )}
      {badge && (
        <div className="absolute -bottom-1 -right-1 w-5 h-5 rounded-full bg-white shadow flex items-center justify-center">
          {badge}
        </div>
      )}
    </div>
  );
}

function resizeImageToDataURL(file, size = 200, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext("2d");
      const scale = Math.max(size / img.width, size / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (size - w) / 2, (size - h) / 2, w, h);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = reject;
    img.src = url;
  });
}

function ProfileModal({ name, profiles, onClose, onSave, onMergeOldName, canMerge }) {
  const fb = window.__firebase;
  const fileRef = useRef(null);
  const [nameDraft, setNameDraft] = useState(name);
  const [preview, setPreview] = useState(profiles[slugify(name)]?.photoURL || null);
  const [birthday, setBirthday] = useState(profiles[slugify(name)]?.birthday || "");
  const [saving, setSaving] = useState(false);
  const [processing, setProcessing] = useState(false);
  const [err, setErr] = useState("");
  const [oldNameInput, setOldNameInput] = useState("");
  const [merging, setMerging] = useState(false);
  const [mergeDone, setMergeDone] = useState(false);

  const pickFile = async (e) => {
    const f = e.target.files?.[0];
    if (!f) return;
    if (!f.type.startsWith("image/")) { setErr("Escolha um arquivo de imagem."); return; }
    if (f.size > 8 * 1024 * 1024) { setErr("A imagem precisa ter até 8MB."); return; }
    setErr("");
    setProcessing(true);
    try {
      const dataUrl = await resizeImageToDataURL(f, 200, 0.75);
      setPreview(dataUrl);
    } catch (e) {
      setErr("Não foi possível processar essa imagem.");
    } finally {
      setProcessing(false);
    }
  };

  const save = async () => {
    const finalName = nameDraft.trim();
    if (!finalName) { setErr("Digite um nome."); return; }
    setSaving(true);
    setErr("");
    try {
      await fb.setDoc(fb.doc(fb.db, "profiles", slugify(finalName)), {
        name: finalName, photoURL: preview || null, birthday: birthday || null,
        updatedAt: fb.serverTimestamp(),
      }, { merge: true });
      onSave(finalName);
    } catch (e) {
      setErr("Não foi possível salvar. Verifique a conexão e tente de novo.");
    } finally {
      setSaving(false);
    }
  };

  const runMerge = async () => {
    if (!oldNameInput.trim()) return;
    setMerging(true);
    setMergeDone(false);
    try {
      await onMergeOldName(oldNameInput.trim());
      setMergeDone(true);
      setOldNameInput("");
    } finally {
      setMerging(false);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
      <div className="absolute inset-0 bg-black/40" onClick={onClose} />
      <div className="relative bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 max-h-[90vh] overflow-y-auto">
        <p className="font-display text-lg text-indigo-950 mb-4">Seu perfil</p>

        <div className="flex flex-col items-center gap-3 mb-4">
          <button onClick={() => fileRef.current?.click()} className="relative group">
            {preview ? (
              <img src={preview} alt="" className="w-24 h-24 rounded-full object-cover border-2 border-indigo-100" />
            ) : (
              <div className={`w-24 h-24 rounded-full flex items-center justify-center text-white text-2xl font-medium ${colorFor(nameDraft)}`}>
                {initials(nameDraft)}
              </div>
            )}
            <div className="absolute inset-0 rounded-full bg-black/30 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
              <CameraIcon className="w-6 h-6 text-white" />
            </div>
          </button>
          <input ref={fileRef} type="file" accept="image/*" className="hidden" onChange={pickFile} />
          <button onClick={() => fileRef.current?.click()} className="text-sm text-indigo-700 font-medium hover:underline">
            {processing ? "Processando…" : preview ? "Trocar foto" : "Adicionar foto"}
          </button>
        </div>

        <label className="block text-xs font-semibold text-slate-500 mb-1">Nome</label>
        <input value={nameDraft} onChange={(e) => setNameDraft(e.target.value)}
          className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-3" />

        <label className="block text-xs font-semibold text-slate-500 mb-1">Aniversário (opcional)</label>
        <input type="date" value={birthday} onChange={(e) => setBirthday(e.target.value)}
          className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 mb-1" />
        <p className="text-[11px] text-slate-400 mb-1">Usamos só o dia e o mês — o ano não aparece pra ninguém.</p>

        {err && <p className="text-xs text-red-500 mt-1">{err}</p>}

        <div className="flex gap-2 mt-5">
          <button onClick={onClose} className="flex-1 rounded-xl border border-slate-200 text-slate-600 py-2 text-sm font-medium hover:bg-slate-50 transition">Cancelar</button>
          <button onClick={save} disabled={saving || processing} className="flex-1 rounded-xl bg-indigo-700 text-white py-2 text-sm font-medium hover:bg-indigo-800 transition disabled:opacity-60">
            {saving ? "Salvando…" : "Salvar"}
          </button>
        </div>

        {canMerge && (
          <div className="mt-5 pt-4 border-t border-slate-100">
            <label className="block text-xs font-semibold text-slate-500 mb-1">Já usou outro nome antes?</label>
            <p className="text-[11px] text-slate-400 mb-2">
              Se essa pessoa mudou de nome e o app pediu pra confirmar presença de novo, ou as orações antigas sumiram do perfil, digite aqui o nome antigo pra juntar tudo aqui.
            </p>
            <div className="flex gap-2">
              <input value={oldNameInput} onChange={(e) => setOldNameInput(e.target.value)} placeholder="Nome antigo (ex: Janaina)"
                className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              <button onClick={runMerge} disabled={merging || !oldNameInput.trim()}
                className="rounded-xl border border-indigo-200 text-indigo-700 px-3 py-2 text-sm font-medium hover:bg-indigo-50 transition disabled:opacity-60 whitespace-nowrap">
                {merging ? "Juntando…" : "Mesclar"}
              </button>
            </div>
            {mergeDone && <p className="text-xs text-emerald-600 mt-1.5">Pronto! Os dados antigos foram unidos ao seu perfil atual.</p>}
          </div>
        )}
      </div>
    </div>
  );
}

          <button onClick={() => setShowNew(false)} className="text-xs text-indigo-500 hover:underline mt-2">

          </button>
        )}
        <p className="text-xs text-slate-400 mt-2">Depois você também pode adicionar uma foto no seu perfil.</p>

  }

  return (
    <div className="bg-white border border-indigo-100 rounded-2xl p-5 shadow-sm">
      <p className="font-medium text-indigo-900 mb-1">Quem é você?</p>
      <p className="text-xs text-slate-400 mb-3">Toque na sua foto para entrar neste aparelho.</p>
      <div className="flex flex-wrap gap-3">
        {list.map((p) => (
          <button key={p.name} onClick={() => onPick(p.name)} className="flex flex-col items-center gap-1 w-16">

            <span className="text-xs text-slate-600 truncate w-full text-center">{p.name}</span>
          </button>
        ))}
      </div>
      <button onClick={() => setShowNew(true)} className="text-xs text-indigo-500 hover:underline mt-3">
        não estou na lista, sou novo(a) aqui →

/* ---------------- Reações + Comentários (reutilizável) ---------------- */
const REACTIONS = ["❤️", "🙏", "🕊️", "🤍", "🫶", "✨", "🦋", "🌿", "🌱", "🕯️", "📖", "⛪", "🛐", "👏", "🎉", "😢", "😂", "👍"];

function ReactionsAndComments({ collectionName, item, currentName, profiles }) {
  const fb = window.__firebase;
  const [showComments, setShowComments] = useState(false);
  const [showPicker, setShowPicker] = useState(false);
  const [namesFor, setNamesFor] = useState(null);
  const [customEmoji, setCustomEmoji] = useState("");
  const [commentDraft, setCommentDraft] = useState("");
  const reactions = item.reactions || {};
  const comments = item.comments || [];
  const activeEmojis = Object.keys(reactions).filter((e) => (reactions[e] || []).length > 0);

  const toggleReaction = async (emoji) => {
    if (!currentName || !emoji) return;
    setShowPicker(false);
    setCustomEmoji("");
    const next = { ...reactions };
    const list = new Set(next[emoji] || []);
    if (list.has(currentName)) list.delete(currentName); else list.add(currentName);
    next[emoji] = Array.from(list);
    try {
      await fb.updateDoc(fb.doc(fb.db, collectionName, item.id), { reactions: next });
    } catch (e) { /* silencioso, não é crítico */ }
  };

  const submitComment = async () => {
    if (!commentDraft.trim()) return;
    try {
      await fb.updateDoc(fb.doc(fb.db, collectionName, item.id), {
        comments: fb.arrayUnion({ author: currentName || "Anônimo", text: commentDraft.trim(), ts: Date.now() }),
      });
      setCommentDraft("");
    } catch (e) { /* silencioso */ }
  };

  return (
    <div className="mt-3">
      <div className="flex items-center gap-1.5 flex-wrap">
        {activeEmojis.map((emoji) => {
          const names = reactions[emoji] || [];
          const active = currentName && names.includes(currentName);
          return (
            <button key={emoji} onClick={() => setNamesFor(namesFor === emoji ? null : emoji)}
              className={`flex items-center gap-1 rounded-full px-2 py-1 text-xs border transition ${
                active ? "bg-indigo-50 border-indigo-300 text-indigo-700" : "bg-white border-slate-200 text-slate-500"
              }`}>
              <span>{emoji}</span>
              <span>{names.length}</span>
            </button>
          );
        })}

        <div className="relative">
          <button onClick={() => setShowPicker(!showPicker)}
            className="flex items-center gap-1 rounded-full px-2.5 py-1 text-xs border border-dashed border-slate-300 text-slate-500 hover:border-indigo-300 hover:text-indigo-600 transition">
            Reagir
          </button>
          {showPicker && (
            <div className="absolute z-10 top-full mt-1 left-0 bg-white border border-slate-200 rounded-xl shadow-lg p-2 w-60">
              <div className="grid grid-cols-6 gap-1">
                {REACTIONS.map((emoji) => {
                  const active = currentName && (reactions[emoji] || []).includes(currentName);
                  return (
                    <button key={emoji} onClick={() => toggleReaction(emoji)}
                      className={`text-lg rounded-lg py-1 hover:bg-indigo-50 transition ${active ? "bg-indigo-50" : ""}`}>
                      {emoji}
                    </button>
                  );
                })}
              </div>
              <div className="flex gap-1 mt-2 pt-2 border-t border-slate-100">
                <input value={customEmoji} onChange={(e) => setCustomEmoji(e.target.value)}
                  onKeyDown={(e) => e.key === "Enter" && toggleReaction(customEmoji.trim())}

                  className="flex-1 min-w-0 rounded-lg border border-slate-200 px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                <button onClick={() => toggleReaction(customEmoji.trim())} className="text-xs text-indigo-700 font-medium px-1.5 shrink-0">usar</button>
              </div>
              <p className="text-[10px] text-slate-400 mt-1">Toque no campo e use o teclado de emojis do seu celular 😊</p>
            </div>
          )}
        </div>

        <button onClick={() => setShowComments(!showComments)}
          className="flex items-center gap-1 rounded-full px-2 py-1 text-xs border border-slate-200 text-slate-500 hover:border-indigo-200 transition">
          <ChatIcon className="w-3.5 h-3.5" />
          {comments.length > 0 ? comments.length : "comentar"}
        </button>
      </div>

      {namesFor && (
        <p className="text-xs text-slate-500 mt-1.5">
          {namesFor} reagido por: {(reactions[namesFor] || []).join(", ")}
        </p>
      )}

      {showComments && (
        <div className="mt-2 space-y-2 pl-1">
          {comments.map((c, i) => (
            <div key={i} className="flex gap-2">
              <Avatar name={c.author} profiles={profiles} size={22} />
              <div className="min-w-0">
                <p className="text-xs"><span className="font-medium text-indigo-800">{c.author}</span></p>
                <p className="text-sm text-slate-600">{c.text}</p>
              </div>
            </div>
          ))}
          <div className="flex gap-2 pt-1">
            <input value={commentDraft} onChange={(e) => setCommentDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && submitComment()}
              placeholder="Escrever um comentário (opcional)…"
              className="flex-1 rounded-lg border border-slate-200 px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <button onClick={submitComment} className="text-xs text-indigo-700 font-medium px-2">Enviar</button>
          </div>
        </div>
      )}
    </div>
  );
}

const MONTHS_PT = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
}
function formatWhen(ts) {
  if (!ts) return "agora há pouco";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }) + " · " +
    d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });
}
function birthdayParts(iso) {
  if (!iso) return null;
  const d = new Date(iso + "T00:00:00");
  return { month: d.getMonth(), day: d.getDate() };
}

function exportAtaPdf(meeting) {
  const { jsPDF } = window.jspdf;
  const docPdf = new jsPDF();
  let y = 20;
  docPdf.setFontSize(16);
  docPdf.text(meeting.title, 14, y); y += 10;
  docPdf.setFontSize(11);
  docPdf.text(`Data: ${formatDate(meeting.date)}${meeting.time ? " às " + meeting.time : ""}`, 14, y); y += 7;
  if (meeting.location) { docPdf.text(`Local: ${meeting.location}`, 14, y); y += 7; }
  if (meeting.address) { docPdf.text(`Endereço: ${meeting.address}`, 14, y); y += 7; }
  y += 3;
  docPdf.setFontSize(12);
  docPdf.text("Presentes:", 14, y); y += 7;
  docPdf.setFontSize(11);
  if (meeting.participants.length) {
    meeting.participants.forEach((p) => { docPdf.text(`- ${p}`, 18, y); y += 6; });
  } else {
    docPdf.text("Nenhum registrado.", 18, y); y += 6;
  }
  y += 4;
  docPdf.setFontSize(12);
  docPdf.text("Resumo:", 14, y); y += 7;
  docPdf.setFontSize(11);
  const lines = docPdf.splitTextToSize(meeting.summary || "Sem resumo registrado.", 180);
  docPdf.text(lines, 14, y);
  docPdf.save(`ata-${slugify(meeting.title)}-${meeting.date}.pdf`);
}

function App() {
  const [ready, setReady] = useState(!!window.__firebase);
  const [tab, setTab] = useState("inicio");
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [errorMsg, setErrorMsg] = useState("");
  const [profileOpen, setProfileOpen] = useState(false);
  const [adminPanelOpen, setAdminPanelOpen] = useState(false);
  const [adminEditTarget, setAdminEditTarget] = useState(null);

  const [name, setName] = useState(() => localStorage.getItem("nt-name") || "");
  const [showNamePrompt, setShowNamePrompt] = useState(!localStorage.getItem("nt-name"));

  const [prayers, setPrayers] = useState([]);
  const [words, setWords] = useState([]);
  const [meetings, setMeetings] = useState([]);
  const [profiles, setProfiles] = useState({});

  useEffect(() => {
    if (window.__firebase) { setReady(true); return; }
    const handler = () => setReady(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, []);

  useEffect(() => {
    if (!ready) return;
    const fb = window.__firebase;
    const unsubs = [];
    try {
      unsubs.push(fb.onSnapshot(
        fb.query(fb.collection(fb.db, "prayers"), fb.orderBy("createdAt", "desc")),
        (snap) => setPrayers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        () => setErrorMsg("Não foi possível conectar ao Firebase.")
      ));
      unsubs.push(fb.onSnapshot(
        fb.query(fb.collection(fb.db, "words"), fb.orderBy("createdAt", "desc")),
        (snap) => setWords(snap.docs.map((d) => ({ id: d.id, ...d.data() })))
      ));
      unsubs.push(fb.onSnapshot(
        fb.collection(fb.db, "meetings"),
        (snap) => setMeetings(snap.docs.map((d) => ({ id: d.id, ...d.data() })))
      ));
      unsubs.push(fb.onSnapshot(
        fb.collection(fb.db, "profiles"),
        (snap) => {
          const map = {};
          snap.docs.forEach((d) => { map[d.id] = d.data(); });
          setProfiles(map);
        }
      ));
    } catch (e) {
      setErrorMsg("Não foi possível conectar ao Firebase.");
    }
    return () => unsubs.forEach((u) => u && u());
  }, [ready]);

  const migrateName = async (oldName, finalName) => {
    if (!oldName || !finalName || oldName === finalName) return;
    const fb = window.__firebase;
    try {
      for (const p of prayers) {
        const patch = {};
        let changed = false;
        if (p.author === oldName) { patch.author = finalName; changed = true; }
        if (p.reactions) {
          const newReactions = {};
          let reactChanged = false;
          Object.entries(p.reactions).forEach(([emoji, names]) => {
            const newNames = (names || []).map((n) => (n === oldName ? finalName : n));
            if (newNames.join("|") !== (names || []).join("|")) reactChanged = true;
            newReactions[emoji] = newNames;
          });
          if (reactChanged) { patch.reactions = newReactions; changed = true; }
        }
        if (p.comments && p.comments.some((c) => c.author === oldName)) {
          patch.comments = p.comments.map((c) => (c.author === oldName ? { ...c, author: finalName } : c));
          changed = true;
        }
        if (changed) await fb.updateDoc(fb.doc(fb.db, "prayers", p.id), patch);
      }
      for (const w of words) {
        const patch = {};
        let changed = false;
        if (w.author === oldName) { patch.author = finalName; changed = true; }
        if (w.reactions) {
          const newReactions = {};
          let reactChanged = false;
          Object.entries(w.reactions).forEach(([emoji, names]) => {
            const newNames = (names || []).map((n) => (n === oldName ? finalName : n));
            if (newNames.join("|") !== (names || []).join("|")) reactChanged = true;
            newReactions[emoji] = newNames;
          });
          if (reactChanged) { patch.reactions = newReactions; changed = true; }
        }
        if (w.comments && w.comments.some((c) => c.author === oldName)) {
          patch.comments = w.comments.map((c) => (c.author === oldName ? { ...c, author: finalName } : c));
          changed = true;
        }
        if (changed) await fb.updateDoc(fb.doc(fb.db, "words", w.id), patch);
      }
      for (const m of meetings) {
        if (m.participants && m.participants.includes(oldName)) {
          const newParticipants = m.participants.map((x) => (x === oldName ? finalName : x));
          await fb.updateDoc(fb.doc(fb.db, "meetings", m.id), { participants: newParticipants });
        }
      }
      if (slugify(oldName) !== slugify(finalName)) {
        try { await fb.deleteDoc(fb.doc(fb.db, "profiles", slugify(oldName))); } catch (e) { /* pode não existir */ }
      }
    } catch (e) {
      setErrorMsg("Alguns itens antigos podem não ter sido atualizados. Tente mesclar novamente.");
    }
  };

  const goTab = (id) => { setTab(id); setSidebarOpen(false); };

  const addPrayer = async (text, link) => {
    if (!text.trim()) return;
    const fb = window.__firebase;
    try {
      await fb.addDoc(fb.collection(fb.db, "prayers"), {
        author: name || "Anônimo", text: text.trim(), link: link.trim(), createdAt: fb.serverTimestamp(),
        reactions: {}, comments: [],
      });
    } catch (e) { setErrorMsg("Não foi possível salvar a oração agora."); }
  };
  const removePrayer = async (id) => {
    const fb = window.__firebase;
    try { await fb.deleteDoc(fb.doc(fb.db, "prayers", id)); }
    catch (e) { setErrorMsg("Não foi possível remover agora."); }
  };
  const updatePrayer = async (id, patch) => {
    const fb = window.__firebase;
    try { await fb.updateDoc(fb.doc(fb.db, "prayers", id), patch); }
    catch (e) { setErrorMsg("Não foi possível salvar agora."); }
  };

  const addWord = async (word, message) => {
    if (!word.trim()) return;
    const fb = window.__firebase;
    try {
      await fb.addDoc(fb.collection(fb.db, "words"), {
        author: name || "Anônimo", word: word.trim(), message: message.trim(), createdAt: fb.serverTimestamp(),
        reactions: {}, comments: [],
      });
    } catch (e) { setErrorMsg("Não foi possível salvar agora."); }
  };
  const removeWord = async (id) => {
    const fb = window.__firebase;
    try { await fb.deleteDoc(fb.doc(fb.db, "words", id)); }
    catch (e) { setErrorMsg("Não foi possível remover agora."); }
  };
  const updateWord = async (id, patch) => {
    const fb = window.__firebase;
    try { await fb.updateDoc(fb.doc(fb.db, "words", id), patch); }
    catch (e) { setErrorMsg("Não foi possível salvar agora."); }
  };

  const addMeeting = async (title, date, time, location, address) => {
    if (!date) return;
    const fb = window.__firebase;
    try {
      await fb.addDoc(fb.collection(fb.db, "meetings"), {
        title: title.trim() || "Encontro do círculo", date, time: time.trim(),
        location: location.trim(), address: address.trim(),
        summary: "", participants: [], status: "pendente",
      });
    } catch (e) { setErrorMsg("Não foi possível marcar o encontro agora."); }
  };
  const updateMeeting = async (id, patch) => {
    const fb = window.__firebase;
    try { await fb.updateDoc(fb.doc(fb.db, "meetings", id), patch); }
    catch (e) { setErrorMsg("Não foi possível salvar agora."); }
  };
  const removeMeeting = async (id) => {
    const fb = window.__firebase;
    try { await fb.deleteDoc(fb.doc(fb.db, "meetings", id)); }
    catch (e) { setErrorMsg("Não foi possível remover agora."); }
  };
  const toggleAttendance = async (meeting) => {
    if (!name) { setShowNamePrompt(true); return; }
    const fb = window.__firebase;
    const present = meeting.participants.includes(name);
    try {
      await fb.updateDoc(fb.doc(fb.db, "meetings", meeting.id), {
        participants: present ? fb.arrayRemove(name) : fb.arrayUnion(name),
      });
    } catch (e) { setErrorMsg("Não foi possível salvar sua presença agora."); }
  };

  const today = new Date().toISOString().slice(0, 10);
  const pendentes = meetings.filter((m) => (m.status || "pendente") === "pendente");
  const nextMeeting = pendentes.slice().sort((a, b) => a.date.localeCompare(b.date))[0];

  const currentMonth = new Date().getMonth();
  const birthdaysThisMonth = Object.values(profiles)
    .filter((p) => p.birthday && birthdayParts(p.birthday)?.month === currentMonth)
    .sort((a, b) => birthdayParts(a.birthday).day - birthdayParts(b.birthday).day);

  const activity = [
    ...prayers.map((p) => ({ ...p, _type: "oracao" })),
    ...words.map((w) => ({ ...w, _type: "motivacional" })),
  ].sort((a, b) => {
    const ta = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
    const tb = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
    return tb - ta;
  }).slice(0, 6);

  if (!ready) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50">
        <div className="flex flex-col items-center gap-3 text-indigo-700">
          <Butterfly size={48} className="animate-pulse" />
          <p className="text-sm">Carregando o círculo…</p>
        </div>
      </div>
    );
  }

  const sidebarContent = (
    <div className="flex flex-col h-full">
      <div className="flex items-center gap-3 px-5 pt-6 pb-8">
        <Butterfly size={40} />
        <div>
          <p className="font-display text-xl font-semibold text-white">Novos Tempos</p>
          <p className="text-indigo-300 text-xs">46° EC · Círculo Azul</p>
        </div>
      </div>
      <nav className="flex-1 px-3 space-y-1">
        {NAV.map(({ id, label, Icon: I }) => (
          <button key={id} onClick={() => goTab(id)}

              tab === id ? "bg-white text-indigo-900" : "text-indigo-100 hover:bg-indigo-800/60"
            }`}>
            <I className="w-5 h-5 shrink-0" />
            {label}
          </button>
        ))}
      </nav>
      {isAdminName(name) && (
        <button onClick={() => setAdminPanelOpen(true)}
          className="flex items-center gap-3 px-5 py-3 text-indigo-200 hover:bg-indigo-800/40 transition text-left text-sm font-medium">
          <UsersIcon className="w-4.5 h-4.5" />

      <button onClick={() => setProfileOpen(true)}
        className="flex items-center gap-3 px-5 py-4 border-t border-indigo-800/60 hover:bg-indigo-800/40 transition text-left">
        <Avatar name={name || "?"} profiles={profiles} size={36} />
        <div className="min-w-0 flex-1">

          </div>
        </div>
        <CameraIcon className="w-4 h-4 text-indigo-300 shrink-0" />
      </button>
    </div>

  return (
    <div className="min-h-screen flex bg-slate-50 text-slate-800">
      <aside className="hidden md:flex md:flex-col w-64 shrink-0 bg-gradient-to-b from-indigo-950 to-indigo-900">

      {sidebarOpen && (
        <div className="fixed inset-0 z-40 md:hidden">
          <div className="absolute inset-0 bg-black/40" onClick={() => setSidebarOpen(false)} />

              <CloseIcon className="w-6 h-6" />

            {sidebarContent}
          </aside>
        </div>
      )}

      {profileOpen && (
        <ProfileModal
          name={name}
          profiles={profiles}
          onClose={() => setProfileOpen(false)}
          onSave={(finalName) => {
            const oldName = name;
            setName(finalName);
            localStorage.setItem("nt-name", finalName);
            setProfileOpen(false);
            if (oldName && oldName !== finalName) migrateName(oldName, finalName);
          }}
          onMergeOldName={(oldName) => migrateName(oldName, name)}
          canMerge={isAdminName(name)}
        />
      )}

      {adminPanelOpen && (
        <AdminProfilesModal
          profiles={profiles}
          onClose={() => setAdminPanelOpen(false)}
          onEditProfile={(targetName) => {
            setAdminPanelOpen(false);
            setAdminEditTarget(targetName);
          }}
        />
      )}

      {adminEditTarget && (
        <ProfileModal
          name={adminEditTarget}
          profiles={profiles}
          onClose={() => setAdminEditTarget(null)}
          onSave={(finalName) => {
            const oldName = adminEditTarget;

          {name && (
            <button onClick={() => setProfileOpen(true)} className="flex items-center gap-2 pl-1 pr-3 py-1 rounded-full hover:bg-indigo-800/60 transition">
              <Avatar name={name} profiles={profiles} size={28} />
              <span className="text-sm font-medium hidden sm:inline">{name}</span>

          )}
        </div>

        {showNamePrompt && (

        {errorMsg && (

        </main>
      </div>
    </div>
  );
}

/* ---------------- Aniversariantes ---------------- */
function AniversariosView({ profiles, currentMonth, currentName }) {
  const fb = window.__firebase;
  const myBirthday = currentName ? profiles[slugify(currentName)]?.birthday : null;
  const [draft, setDraft] = useState(myBirthday || "");
  const [saving, setSaving] = useState(false);

  const saveBirthday = async () => {
    if (!currentName || !draft) return;
    setSaving(true);
    try {
      await fb.setDoc(fb.doc(fb.db, "profiles", slugify(currentName)), {
        name: currentName, birthday: draft, updatedAt: fb.serverTimestamp(),
      }, { merge: true });
    } catch (e) { /* silencioso */ }
    setSaving(false);
  };

  const list = Object.values(profiles)
    .filter((p) => p.birthday)
    .map((p) => ({ ...p, _parts: birthdayParts(p.birthday) }))
    .sort((a, b) => a._parts.month - b._parts.month || a._parts.day - b._parts.day);

  return (
    <div className="space-y-6">
      <div className="flex items-center gap-2">
        <GiftIcon className="w-5 h-5 text-amber-600" />
        <p className="font-display text-xl text-indigo-950">Aniversariantes</p>
      </div>

      {currentName && !myBirthday && (
        <div className="bg-white rounded-2xl border border-slate-200 p-5">
          <p className="text-sm font-medium text-indigo-900 mb-2">Você ainda não cadastrou seu aniversário</p>
          <div className="flex gap-2">
            <input type="date" value={draft} onChange={(e) => setDraft(e.target.value)}
              className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
            <button onClick={saveBirthday} disabled={saving || !draft}
              className="rounded-xl bg-indigo-700 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-800 transition disabled:opacity-60">
              {saving ? "Salvando…" : "Salvar"}
            </button>
          </div>
          <p className="text-[11px] text-slate-400 mt-1.5">Usamos só o dia e o mês — o ano não aparece pra ninguém.</p>
        </div>
      )}

      {list.length === 0 ? (
        <p className="text-sm text-slate-400 text-center py-8">Ninguém cadastrou aniversário ainda.</p>
      ) : (
        <div className="space-y-2">
          {list.map((p) => (
            <div key={p.name} className={`flex items-center gap-3 rounded-2xl border p-3 ${
              p._parts.month === currentMonth ? "bg-amber-50 border-amber-200" : "bg-white border-slate-200"
            }`}>
              <Avatar name={p.name} profiles={profiles} size={36} />
              <div className="min-w-0 flex-1">
                <p className="text-sm font-medium text-indigo-900">{p.name}</p>
                <p className="text-xs text-slate-500">{p._parts.day} de {MONTHS_PT[p._parts.month]}</p>
              </div>
              {p._parts.month === currentMonth && <span className="text-xs text-amber-600 font-medium">este mês 🎉</span>}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ReunioesView({ meetings, onAdd, onUpdate, onRemove, onToggleAttendance, currentName, profiles }) {
  const [formOpen, setFormOpen] = useState(false);
  const [title, setTitle] = useState("");
  const [date, setDate] = useState("");
  const [time, setTime] = useState("");
  const [location, setLocation] = useState("");
  const [address, setAddress] = useState("");
  const [openId, setOpenId] = useState(null);
  const [search, setSearch] = useState("");

  const submit = async () => {
    if (!date) return;
    await onAdd(title, date, time, location, address);
    setTitle(""); setDate(""); setTime(""); setLocation(""); setAddress("");
    setFormOpen(false);
  };

  const pendentes = meetings.filter((m) => (m.status || "pendente") === "pendente").sort((a, b) => a.date.localeCompare(b.date));
  const historico = meetings.filter((m) => m.status === "concluido").sort((a, b) => b.date.localeCompare(a.date));
  const searchLower = search.trim().toLowerCase();
  const historicoFiltrado = searchLower
    ? historico.filter((m) =>
        (m.title || "").toLowerCase().includes(searchLower) ||
        (m.summary || "").toLowerCase().includes(searchLower) ||
        (m.location || "").toLowerCase().includes(searchLower))
    : historico;

  return (
    <div className="space-y-6">
      <div className="flex items-center gap-2">
        <CalendarIcon className="w-5 h-5 text-indigo-600" />
        <p className="font-display text-xl text-indigo-950">Reuniões</p>
      </div>

      <div>
        <p className="text-sm font-semibold text-slate-500 mb-2">Próximos</p>
        <div className="space-y-3">
          {pendentes.length === 0 && <p className="text-sm text-slate-400">Nenhum encontro pendente.</p>}
          {pendentes.map((m) => (
            <MeetingCard key={m.id} meeting={m} open={openId === m.id} onToggleOpen={() => setOpenId(openId === m.id ? null : m.id)}
              onUpdate={onUpdate} onRemove={onRemove} onToggleAttendance={onToggleAttendance} currentName={currentName} profiles={profiles} />
          ))}

      <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
        <button onClick={() => setFormOpen(!formOpen)} className="w-full flex items-center gap-3 px-5 py-3.5 text-left">
          <div className="w-9 h-9 rounded-full bg-indigo-50 flex items-center justify-center shrink-0">
            <CalendarIcon className="w-4.5 h-4.5 text-indigo-600" />
          </div>
          <p className="flex-1 text-sm font-medium text-indigo-900">Marcar novo encontro</p>
          <span className="text-slate-300">{formOpen ? "▲" : "▼"}</span>
        </button>
        {formOpen && (
          <div className="px-5 pb-5 border-t border-slate-100 pt-4">
            <div className="grid gap-2 sm:grid-cols-2">
              <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Título (ex: Encontro mensal)"
                className="rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 sm:col-span-2" />
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
                className="rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              <div className="relative">
                <ClockIcon className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />
                <input type="time" value={time} onChange={(e) => setTime(e.target.value)}
                  className="w-full rounded-xl border border-slate-200 pl-9 pr-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              </div>
            </div>
            <div className="relative mt-2">
              <PinIcon className="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" />

function MeetingCard({ meeting, open, onToggleOpen, onUpdate, onRemove, onToggleAttendance, currentName, profiles }) {

  const [eAddress, setEAddress] = useState(meeting.address || "");
  const present = currentName && meeting.participants.includes(currentName);
  const isConcluded = meeting.status === "concluido";
  const saveSummary = () => { if (summaryDraft !== meeting.summary) onUpdate(meeting.id, { summary: summaryDraft }); };
  const saveEdit = () => {
    onUpdate(meeting.id, {
      title: eTitle.trim() || "Encontro do círculo", date: eDate, time: eTime.trim(),
      location: eLocation.trim(), address: eAddress.trim(),

    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">

            {isConcluded && <span className="text-[10px] bg-emerald-50 text-emerald-600 rounded-full px-2 py-0.5 font-medium shrink-0">concluído</span>}
          </div>
          <div className="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1">
            <div className="flex items-center gap-1.5 text-sm font-semibold text-slate-600">
              <CalendarIcon className="w-4 h-4 text-indigo-500 shrink-0" />
              <span>{formatDate(meeting.date)}</span>
            </div>
            {meeting.time && (
              <div className="flex items-center gap-1.5 text-sm font-semibold text-slate-600">
                <ClockIcon className="w-4 h-4 text-indigo-500 shrink-0" />
                <span>{meeting.time}</span>
              </div>
            )}
          </div>
          {meeting.location && (
            <div className="flex items-center gap-1 text-xs text-slate-400 mt-1">
              <PinIcon className="w-3.5 h-3.5 text-amber-500 shrink-0" />
              <span className="truncate">{meeting.location}</span>
            </div>
          )}
        </div>
        <span className="flex items-center gap-1 text-xs text-slate-400 shrink-0">
          ver detalhes <span className="text-slate-300">{open ? "▲" : "▼"}</span>
        </span>
      </button>

      {!isConcluded && (
        <div className="px-4 pb-3.5 flex items-center justify-between gap-3">
          <button onClick={() => onToggleAttendance(meeting)}
            className={`text-sm rounded-xl px-3 py-1.5 font-medium transition ${present ? "bg-indigo-700 text-white" : "bg-slate-100 text-slate-600 hover:bg-indigo-50"}`}>
            {present ? "✓ Presença confirmada" : "Confirmar presença"}
          </button>
          <span className="text-xs text-slate-400 shrink-0">{meeting.participants.length} presentes</span>
        </div>
      )}

      {open && (
        <div className="px-4 pb-4 border-t border-slate-100 pt-3 space-y-4">
          {editing ? (
            <div className="space-y-2 bg-slate-50 rounded-xl p-3">
              <input value={eTitle} onChange={(e) => setETitle(e.target.value)} placeholder="Título"
                className="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              <div className="grid grid-cols-2 gap-2">
                <input type="date" value={eDate} onChange={(e) => setEDate(e.target.value)}
                  className="rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
                <input type="time" value={eTime} onChange={(e) => setETime(e.target.value)}
                  className="rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              </div>
              <input value={eLocation} onChange={(e) => setELocation(e.target.value)} placeholder="Local"
                className="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              <input value={eAddress} onChange={(e) => setEAddress(e.target.value)} placeholder="Endereço opcional"
                className="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              <div className="flex gap-2 pt-1">
                <button onClick={() => setEditing(false)} className="flex-1 rounded-lg border border-slate-200 text-slate-600 py-1.5 text-sm hover:bg-white transition">Cancelar</button>
                <button onClick={saveEdit} className="flex-1 rounded-lg bg-indigo-700 text-white py-1.5 text-sm font-medium hover:bg-indigo-800 transition">Salvar</button>
              </div>
            </div>
          ) : (
            <button onClick={() => setEditing(true)} className="text-xs text-indigo-600 font-medium hover:underline">
              editar encontro
            </button>
          )}

          {meeting.address && (
            <a href={`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(meeting.address)}`}
              target="_blank" rel="noopener noreferrer"
              className="inline-flex items-center gap-1.5 text-sm text-amber-600 hover:underline">
              <AddressIcon className="w-4 h-4" /> {meeting.address} · abrir no mapa
            </a>
          )}

          {meeting.participants.length > 0 && (
            <div className="flex flex-wrap items-center gap-2">
              {meeting.participants.map((p) => (
                <div key={p} className="flex items-center gap-1.5 bg-slate-50 rounded-full pl-1 pr-2.5 py-1">
                  <Avatar name={p} profiles={profiles} size={20} />
                  <span className="text-xs text-slate-600">{p}</span>
                </div>
              ))}
            </div>
          )}

          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1">Resumo do encontro</p>
            <textarea value={summaryDraft} onChange={(e) => setSummaryDraft(e.target.value)} onBlur={saveSummary}
              placeholder="O que foi falado, combinado, orado…" rows={3}
              className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none" />
          </div>

          <div className="flex flex-wrap items-center gap-4 pt-1">
            {!isConcluded ? (
              <button onClick={() => onUpdate(meeting.id, { status: "concluido" })}
                className="flex items-center gap-1.5 text-xs text-emerald-600 font-medium hover:underline">
                <CheckIcon className="w-3.5 h-3.5" /> marcar como concluído
              </button>
            ) : (
              <button onClick={() => onUpdate(meeting.id, { status: "pendente" })}
                className="text-xs text-indigo-600 font-medium hover:underline">
                reabrir encontro
              </button>
            )}
            <button onClick={() => exportAtaPdf(meeting)} className="flex items-center gap-1.5 text-xs text-indigo-600 font-medium hover:underline">
              <DownloadIcon className="w-3.5 h-3.5" /> baixar ata (PDF)
            </button>
            {confirmDelete ? (
              <span className="flex items-center gap-2 text-xs">
                <span className="text-slate-500">Tem certeza?</span>
                <button onClick={() => onRemove(meeting.id)} className="text-red-500 font-medium">Sim, excluir</button>
                <button onClick={() => setConfirmDelete(false)} className="text-slate-400">cancelar</button>
              </span>
            ) : (
              <button onClick={() => setConfirmDelete(true)} className="text-xs text-slate-400 hover:text-red-500">excluir encontro</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
