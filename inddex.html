<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#312e81" />
<title>Novos Tempos · 46° EC</title>
<link rel="icon" type="image/png" href="borboleta.png" />

<!-- Tailwind (via CDN, sem build) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- Fonte -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- React (via CDN) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<!-- Babel: permite escrever JSX direto no navegador, sem etapa de build -->
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
  body { font-family: 'Inter', ui-sans-serif, system-ui; }
  .font-display { font-family: 'Fraunces', Georgia, serif; }
</style>
</head>
<body class="bg-slate-50">
<div id="root"></div>

<!-- ===================================================================
     CONFIGURAÇÃO DO FIREBASE
     Projeto: novos-tempos-46ec
     =================================================================== -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, deleteDoc, updateDoc, doc,
    onSnapshot, query, orderBy, arrayUnion, arrayRemove, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBrLgWg_uKqCoEydKNH8pLueT8y8UH9Js",
    authDomain: "novos-tempos-46ec.firebaseapp.com",
    projectId: "novos-tempos-46ec",
    storageBucket: "novos-tempos-46ec.firebasestorage.app",
    messagingSenderId: "685086916540",
    appId: "1:685086916540:web:ab722c88107001350f35b9",
    measurementId: "G-RW2WTP734E",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Expõe tudo em window para o script React (abaixo) poder usar,
  // já que módulos ES e o Babel-in-browser rodam separados.
  window.__firebase = {
    db, collection, addDoc, deleteDoc, updateDoc, doc,
    onSnapshot, query, orderBy, arrayUnion, arrayRemove, serverTimestamp
  };
  window.dispatchEvent(new Event("firebase-ready"));
</script>

<!-- ===================================================================
     APP REACT (JSX transformado no navegador pelo Babel)
     =================================================================== -->
<script type="text/babel" data-type="module">
const { useState, useEffect, useCallback } = React;

function Butterfly({ className = "", size = 40 }) {
  return (
    <img
      src="borboleta.png"
      alt="Borboleta azul"
      className={className}
      style={{ width: size, height: size, objectFit: "contain" }}
    />
  );
}

const TABS = [
  { id: "inicio", label: "Início" },
  { id: "oracoes", label: "Orações" },
  { id: "palavras", label: "Palavras" },
  { id: "reunioes", label: "Reuniões" },
];

function formatDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
}

function App() {
  const [ready, setReady] = useState(!!window.__firebase);
  const [tab, setTab] = useState("inicio");
  const [errorMsg, setErrorMsg] = useState("");

  const [name, setName] = useState(() => localStorage.getItem("nt-name") || "");
  const [nameDraft, setNameDraft] = useState("");
  const [showNamePrompt, setShowNamePrompt] = useState(!localStorage.getItem("nt-name"));

  const [prayers, setPrayers] = useState([]);
  const [words, setWords] = useState([]);
  const [meetings, setMeetings] = useState([]);

  useEffect(() => {
    if (window.__firebase) { setReady(true); return; }
    const handler = () => setReady(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, []);

  useEffect(() => {
    if (!ready) return;
    const fb = window.__firebase;
    const unsubs = [];
    try {
      unsubs.push(fb.onSnapshot(
        fb.query(fb.collection(fb.db, "prayers"), fb.orderBy("createdAt", "desc")),
        (snap) => setPrayers(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        () => setErrorMsg("Não foi possível conectar ao Firebase.")
      ));
      unsubs.push(fb.onSnapshot(
        fb.query(fb.collection(fb.db, "words"), fb.orderBy("createdAt", "desc")),
        (snap) => setWords(snap.docs.map((d) => ({ id: d.id, ...d.data() })))
      ));
      unsubs.push(fb.onSnapshot(
        fb.query(fb.collection(fb.db, "meetings"), fb.orderBy("date", "asc")),
        (snap) => setMeetings(snap.docs.map((d) => ({ id: d.id, ...d.data() })))
      ));
    } catch (e) {
      setErrorMsg("Não foi possível conectar ao Firebase.");
    }
    return () => unsubs.forEach((u) => u && u());
  }, [ready]);

  const saveName = () => {
    const trimmed = nameDraft.trim();
    if (!trimmed) return;
    setName(trimmed);
    localStorage.setItem("nt-name", trimmed);
    setShowNamePrompt(false);
  };

  const addPrayer = async (text, link) => {
    if (!text.trim()) return;
    const fb = window.__firebase;
    try {
      await fb.addDoc(fb.collection(fb.db, "prayers"), {
        author: name || "Anônimo", text: text.trim(), link: link.trim(), createdAt: fb.serverTimestamp(),
      });
    } catch (e) { setErrorMsg("Não foi possível salvar a oração agora."); }
  };
  const removePrayer = async (id) => {
    const fb = window.__firebase;
    try { await fb.deleteDoc(fb.doc(fb.db, "prayers", id)); }
    catch (e) { setErrorMsg("Não foi possível remover agora."); }
  };

  const addWord = async (word, message) => {
    if (!word.trim()) return;
    const fb = window.__firebase;
    try {
      await fb.addDoc(fb.collection(fb.db, "words"), {
        author: name || "Anônimo", word: word.trim(), message: message.trim(), createdAt: fb.serverTimestamp(),
      });
    } catch (e) { setErrorMsg("Não foi possível salvar a palavra agora."); }
  };
  const removeWord = async (id) => {
    const fb = window.__firebase;
    try { await fb.deleteDoc(fb.doc(fb.db, "words", id)); }
    catch (e) { setErrorMsg("Não foi possível remover agora."); }
  };

  const addMeeting = async (title, date) => {
    if (!date) return;
    const fb = window.__firebase;
    try {
      await fb.addDoc(fb.collection(fb.db, "meetings"), {
        title: title.trim() || "Encontro do círculo", date, summary: "", participants: [],
      });
    } catch (e) { setErrorMsg("Não foi possível marcar o encontro agora."); }
  };
  const updateMeeting = async (id, patch) => {
    const fb = window.__firebase;
    try { await fb.updateDoc(fb.doc(fb.db, "meetings", id), patch); }
    catch (e) { setErrorMsg("Não foi possível salvar agora."); }
  };
  const removeMeeting = async (id) => {
    const fb = window.__firebase;
    try { await fb.deleteDoc(fb.doc(fb.db, "meetings", id)); }
    catch (e) { setErrorMsg("Não foi possível remover agora."); }
  };
  const toggleAttendance = async (meeting) => {
    if (!name) { setShowNamePrompt(true); return; }
    const fb = window.__firebase;
    const present = meeting.participants.includes(name);
    try {
      await fb.updateDoc(fb.doc(fb.db, "meetings", meeting.id), {
        participants: present ? fb.arrayRemove(name) : fb.arrayUnion(name),
      });
    } catch (e) { setErrorMsg("Não foi possível salvar sua presença agora."); }
  };

  const today = new Date().toISOString().slice(0, 10);
  const nextMeeting = meetings.filter((m) => m.date >= today).sort((a, b) => a.date.localeCompare(b.date))[0];

  if (!ready) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-slate-50">
        <div className="flex flex-col items-center gap-3 text-indigo-700">
          <Butterfly size={48} className="animate-pulse" />
          <p className="text-sm">Carregando o círculo…</p>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800">
      <header className="relative overflow-hidden bg-gradient-to-br from-indigo-900 via-indigo-800 to-indigo-700 text-white">
        <Butterfly size={220} className="absolute -right-10 -top-10 opacity-10 rotate-12" />
        <div className="relative px-6 py-8 max-w-3xl mx-auto">
          <div className="flex items-center gap-3">
            <Butterfly size={44} />
            <div>
              <div className="flex items-baseline gap-2">
                <h1 className="font-display text-3xl font-semibold tracking-tight">Novos Tempos</h1>
                <span className="text-indigo-300 text-xs font-medium tracking-wide">46° EC</span>
              </div>
              <p className="text-indigo-200 text-sm">Círculo Azul · encontro de casais</p>
            </div>
          </div>
          {name ? (
            <p className="mt-4 text-indigo-100 text-sm">Olá, <span className="font-semibold">{name}</span>. Bem-vindo(a) de volta.</p>
          ) : (
            <p className="mt-4 text-indigo-100 text-sm">Diga quem é você para começar a participar.</p>
          )}
        </div>
      </header>

      {showNamePrompt && (
        <div className="max-w-3xl mx-auto px-6 pt-6">
          <div className="bg-white border border-indigo-100 rounded-2xl p-5 shadow-sm">
            <p className="font-medium text-indigo-900 mb-2">Como podemos te chamar?</p>
            <div className="flex gap-2">
              <input value={nameDraft} onChange={(e) => setNameDraft(e.target.value)} onKeyDown={(e) => e.key === "Enter" && saveName()}
                placeholder="Seu nome ou nome do casal"
                className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
              <button onClick={saveName} className="rounded-xl bg-indigo-700 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-800 transition">Salvar</button>
            </div>
          </div>
        </div>
      )}

      {errorMsg && (
        <div className="max-w-3xl mx-auto px-6 pt-4">
          <div className="bg-amber-50 border border-amber-200 text-amber-800 rounded-xl px-4 py-2 text-sm">{errorMsg}</div>
        </div>
      )}

      <nav className="max-w-3xl mx-auto px-6 mt-6">
        <div className="flex gap-1 bg-white border border-slate-200 rounded-2xl p-1">
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={`flex-1 rounded-xl py-2 text-sm font-medium transition ${tab === t.id ? "bg-indigo-700 text-white" : "text-slate-500 hover:text-indigo-700"}`}>
              {t.label}
            </button>
          ))}
        </div>
      </nav>

      <main className="max-w-3xl mx-auto px-6 py-8">
        {tab === "inicio" && <InicioView name={name} prayersCount={prayers.length} wordsCount={words.length} nextMeeting={nextMeeting} onGo={setTab} />}
        {tab === "oracoes" && <OracoesView prayers={prayers} onAdd={addPrayer} onRemove={removePrayer} currentName={name} />}
        {tab === "palavras" && <PalavrasView words={words} onAdd={addWord} onRemove={removeWord} currentName={name} />}
        {tab === "reunioes" && (
          <ReunioesView meetings={meetings} onAdd={addMeeting} onUpdate={updateMeeting} onRemove={removeMeeting}
            onToggleAttendance={toggleAttendance} currentName={name} today={today} />
        )}
      </main>
    </div>
  );
}

function InicioView({ name, prayersCount, wordsCount, nextMeeting, onGo }) {
  return (
    <div className="space-y-6">
      <div className="grid grid-cols-2 gap-4">
        <StatCard label="Orações compartilhadas" value={prayersCount} onClick={() => onGo("oracoes")} />
        <StatCard label="Palavras compartilhadas" value={wordsCount} onClick={() => onGo("palavras")} />
      </div>
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <p className="font-display text-lg text-indigo-900 mb-1">Próximo encontro</p>
        {nextMeeting ? (
          <div>
            <p className="text-slate-700">{nextMeeting.title}</p>
            <p className="text-sm text-slate-500">{formatDate(nextMeeting.date)}</p>
            <button onClick={() => onGo("reunioes")} className="mt-3 text-sm text-indigo-700 font-medium hover:underline">Ver detalhes e confirmar presença →</button>
          </div>
        ) : (
          <div>
            <p className="text-sm text-slate-500">Nenhum encontro marcado ainda.</p>
            <button onClick={() => onGo("reunioes")} className="mt-3 text-sm text-indigo-700 font-medium hover:underline">Marcar um encontro →</button>
          </div>
        )}
      </div>
      <div className="bg-gradient-to-br from-indigo-50 to-amber-50 rounded-2xl border border-indigo-100 p-5">
        <p className="text-sm text-slate-600 leading-relaxed">
          Como a borboleta, cada temporada traz uma nova forma. Aqui o círculo azul guarda as orações, as palavras e a memória dos nossos encontros.
        </p>
      </div>
    </div>
  );
}

function StatCard({ label, value, onClick }) {
  return (
    <button onClick={onClick} className="text-left bg-white rounded-2xl border border-slate-200 p-5 hover:border-indigo-300 transition">
      <p className="font-display text-3xl text-indigo-800">{value}</p>
      <p className="text-sm text-slate-500 mt-1">{label}</p>
    </button>
  );
}

function OracoesView({ prayers, onAdd, onRemove, currentName }) {
  const [text, setText] = useState("");
  const [link, setLink] = useState("");
  const submit = async () => { if (!text.trim()) return; await onAdd(text, link); setText(""); setLink(""); };
  return (
    <div className="space-y-6">
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <p className="font-display text-lg text-indigo-900 mb-3">Compartilhar uma oração</p>
        <textarea value={text} onChange={(e) => setText(e.target.value)} placeholder="Escreva um pedido de oração, uma reflexão ou um versículo…" rows={3}
          className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none" />
        <input value={link} onChange={(e) => setLink(e.target.value)} placeholder="Link opcional (áudio, vídeo, texto…)"
          className="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <button onClick={submit} className="mt-3 rounded-xl bg-indigo-700 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-800 transition">Compartilhar</button>
      </div>
      <div className="space-y-3">
        {prayers.length === 0 && <p className="text-sm text-slate-400 text-center py-8">Ainda não há orações compartilhadas. Seja o primeiro.</p>}
        {prayers.map((p) => (
          <div key={p.id} className="bg-white rounded-2xl border border-slate-200 p-4">
            <div className="flex items-start justify-between gap-2">
              <p className="text-sm font-medium text-indigo-800">{p.author}</p>
              {p.author === currentName && <button onClick={() => onRemove(p.id)} className="text-xs text-slate-400 hover:text-red-500">remover</button>}
            </div>
            <p className="mt-2 text-slate-700 text-sm whitespace-pre-wrap">{p.text}</p>
            {p.link && <a href={p.link} target="_blank" rel="noopener noreferrer" className="mt-2 inline-block text-sm text-amber-600 hover:underline break-all">{p.link}</a>}
          </div>
        ))}
      </div>
    </div>
  );
}

function PalavrasView({ words, onAdd, onRemove, currentName }) {
  const [word, setWord] = useState("");
  const [message, setMessage] = useState("");
  const submit = async () => { if (!word.trim()) return; await onAdd(word, message); setWord(""); setMessage(""); };
  return (
    <div className="space-y-6">
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <p className="font-display text-lg text-indigo-900 mb-3">Sua palavra</p>
        <input value={word} onChange={(e) => setWord(e.target.value)} placeholder="Uma palavra que representa este momento (ex: gratidão, recomeço…)"
          className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <textarea value={message} onChange={(e) => setMessage(e.target.value)} placeholder="Quer contar por quê? (opcional)" rows={2}
          className="mt-2 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none" />
        <button onClick={submit} className="mt-3 rounded-xl bg-indigo-700 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-800 transition">Compartilhar palavra</button>
      </div>
      <div className="flex flex-wrap gap-3">
        {words.length === 0 && <p className="text-sm text-slate-400 text-center py-8 w-full">Nenhuma palavra compartilhada ainda.</p>}
        {words.map((w) => (
          <div key={w.id} className="bg-gradient-to-br from-indigo-50 to-amber-50 border border-indigo-100 rounded-2xl px-4 py-3 max-w-xs">
            <div className="flex items-center justify-between gap-2">
              <p className="font-display text-lg text-indigo-900">{w.word}</p>
              {w.author === currentName && <button onClick={() => onRemove(w.id)} className="text-xs text-slate-400 hover:text-red-500">remover</button>}
            </div>
            {w.message && <p className="text-sm text-slate-600 mt-1">{w.message}</p>}
            <p className="text-xs text-indigo-500 mt-2">— {w.author}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

function ReunioesView({ meetings, onAdd, onUpdate, onRemove, onToggleAttendance, currentName, today }) {
  const [title, setTitle] = useState("");
  const [date, setDate] = useState("");
  const [openId, setOpenId] = useState(null);
  const submit = async () => { if (!date) return; await onAdd(title, date); setTitle(""); setDate(""); };
  const upcoming = meetings.filter((m) => m.date >= today);
  const past = meetings.filter((m) => m.date < today).sort((a, b) => b.date.localeCompare(a.date));
  return (
    <div className="space-y-6">
      <div className="bg-white rounded-2xl border border-slate-200 p-5">
        <p className="font-display text-lg text-indigo-900 mb-3">Marcar um encontro</p>
        <div className="flex flex-col sm:flex-row gap-2">
          <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="Título (ex: Encontro mensal)"
            className="flex-1 rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <input type="date" value={date} onChange={(e) => setDate(e.target.value)}
            className="rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
          <button onClick={submit} className="rounded-xl bg-indigo-700 text-white px-4 py-2 text-sm font-medium hover:bg-indigo-800 transition whitespace-nowrap">Marcar</button>
        </div>
      </div>
      <div>
        <p className="text-sm font-semibold text-slate-500 mb-2">Próximos</p>
        <div className="space-y-3">
          {upcoming.length === 0 && <p className="text-sm text-slate-400">Nenhum encontro marcado.</p>}
          {upcoming.map((m) => (
            <MeetingCard key={m.id} meeting={m} open={openId === m.id} onToggleOpen={() => setOpenId(openId === m.id ? null : m.id)}
              onUpdate={onUpdate} onRemove={onRemove} onToggleAttendance={onToggleAttendance} currentName={currentName} />
          ))}
        </div>
      </div>
      {past.length > 0 && (
        <div>
          <p className="text-sm font-semibold text-slate-500 mb-2 mt-6">Realizados</p>
          <div className="space-y-3">
            {past.map((m) => (
              <MeetingCard key={m.id} meeting={m} open={openId === m.id} onToggleOpen={() => setOpenId(openId === m.id ? null : m.id)}
                onUpdate={onUpdate} onRemove={onRemove} onToggleAttendance={onToggleAttendance} currentName={currentName} />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function MeetingCard({ meeting, open, onToggleOpen, onUpdate, onRemove, onToggleAttendance, currentName }) {
  const [summaryDraft, setSummaryDraft] = useState(meeting.summary || "");
  const present = currentName && meeting.participants.includes(currentName);
  const saveSummary = () => { if (summaryDraft !== meeting.summary) onUpdate(meeting.id, { summary: summaryDraft }); };
  return (
    <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
      <button onClick={onToggleOpen} className="w-full text-left px-4 py-3 flex items-center justify-between">
        <div>
          <p className="text-sm font-medium text-indigo-900">{meeting.title}</p>
          <p className="text-xs text-slate-400">{formatDate(meeting.date)}</p>
        </div>
        <div className="flex items-center gap-3">
          <span className="text-xs text-slate-400">{meeting.participants.length} presentes</span>
          <span className="text-slate-300">{open ? "▲" : "▼"}</span>
        </div>
      </button>
      {open && (
        <div className="px-4 pb-4 border-t border-slate-100 pt-3 space-y-4">
          <div>
            <button onClick={() => onToggleAttendance(meeting)}
              className={`text-sm rounded-xl px-3 py-1.5 font-medium transition ${present ? "bg-indigo-700 text-white" : "bg-slate-100 text-slate-600 hover:bg-indigo-50"}`}>
              {present ? "✓ Presença confirmada" : "Confirmar presença"}
            </button>
            {meeting.participants.length > 0 && <p className="text-xs text-slate-400 mt-2">Confirmados: {meeting.participants.join(", ")}</p>}
          </div>
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1">Resumo do encontro</p>
            <textarea value={summaryDraft} onChange={(e) => setSummaryDraft(e.target.value)} onBlur={saveSummary}
              placeholder="O que foi falado, combinado, orado…" rows={3}
              className="w-full rounded-xl border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 resize-none" />
          </div>
          <button onClick={() => onRemove(meeting.id)} className="text-xs text-slate-400 hover:text-red-500">excluir encontro</button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
